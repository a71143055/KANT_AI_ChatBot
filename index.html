<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mini-Kaggle 기반 KANT Claude Chatbot</title>
  <style>
    body { font-family: Arial, sans-serif; max-width:900px; margin:2rem auto; }
    #chat { border:1px solid #ddd; padding:1rem; height:60vh; overflow:auto; background:#fafafa; }
    .msg { margin:0.5rem 0; padding:0.5rem; border-radius:6px; max-width:80%; }
    .user { margin-left:auto; background:#e8f0ff; color:#0b66ff; text-align:right; }
    .bot { margin-right:auto; background:#fff; color:#111; text-align:left; box-shadow:0 0 0 1px rgba(0,0,0,0.02); }
    #inputRow { display:flex; gap:0.5rem; margin-top:1rem; }
    input[type="text"], input[type="password"] { flex:1; padding:0.6rem; font-size:1rem; border:1px solid #ccc; border-radius:6px; }
    button { padding:0.6rem 1rem; border-radius:6px; border:none; background:#0b66ff; color:#fff; cursor:pointer; }
    button:disabled { opacity:0.6; cursor:not-allowed; }
    footer { margin-top:1rem; font-size:0.9rem; color:#666; }
    .small { font-size:0.9rem; color:#666; }
    .kbd { background:#f3f3f3; padding:0.1rem 0.4rem; border-radius:4px; font-family:monospace; }
  </style>
</head>
<body>
  <h1>KANT Claude Chatbot (Mini-Kaggle 기반)</h1>
  <div id="chat" aria-live="polite"></div>

  <div id="inputRow">
    <input id="message" type="text" placeholder="질문을 입력하세요. 예: '데이터셋은 무엇을 포함하나요?'" />
    <button id="send">전송</button>
  </div>

  <div style="margin-top:0.5rem; display:flex; gap:0.5rem; align-items:center;">
    <input id="userKey" type="password" placeholder="(선택) 개인 Claude API 키 입력" />
    <button id="saveKey">임시로 사용</button>
  </div>
  <div class="small">설명: 개인 키를 입력하면 해당 세션의 요청에만 키가 사용됩니다. 현재는 클라이언트 전용 로컬 모드가 기본이라 키 없이 동작합니다.</div>

  <footer>
    프론트엔드만으로 동작하는 로컬 룰 기반 챗봇입니다. 더 풍부한 답변이 필요하면 백엔드를 배포하고 API 키를 설정하세요.
  </footer>

  <script>
    const chatEl = document.getElementById('chat');
    const messageEl = document.getElementById('message');
    const sendBtn = document.getElementById('send');
    const userKeyEl = document.getElementById('userKey');
    const saveKeyBtn = document.getElementById('saveKey');

    let tempKey = null; // 세션 동안만 사용 (현재 클라이언트 전용 모드에서는 사용 안 함)

    function appendMsg(text, cls) {
      const d = document.createElement('div');
      d.className = 'msg ' + cls;
      d.textContent = text;
      chatEl.appendChild(d);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    saveKeyBtn.addEventListener('click', () => {
      tempKey = userKeyEl.value.trim() || null;
      if (tempKey) {
        alert('개인 키가 세션에 설정되었습니다. 새로고침하면 제거됩니다. (현재 모드에서는 키가 사용되지 않습니다)');
        userKeyEl.value = '';
      } else {
        alert('빈 키는 설정하지 않습니다.');
      }
    });

    // 확장된 클라이언트 측 localResponder
    function localResponder(message) {
      const m = (message || '').toLowerCase();

      // 도움말
      if (m === '도움' || m === 'help' || m.includes('무엇을')) {
        return "예시 질문: '안녕', '데이터셋은 무엇을 포함하나요?', '제출 형식 알려줘', '평가 지표는?', '전처리 방법 추천'";
      }

      // 인사
      if (m.includes('안녕') || m.includes('안녕하세요') || m.includes('hi') || m.includes('hello')) {
        return '안녕하세요! Mini-Kaggle 기반 챗봇입니다. 데이터셋, 제출 방법, 평가 지표, 전처리, 베이스라인 등 질문해 주세요.';
      }

      // 데이터셋
      if (m.includes('데이터셋') || m.includes('dataset') || m.includes('data')) {
        return '데이터셋은 보통 train.csv, val.csv, test.csv 형태로 제공됩니다. 각 행은 샘플이며 컬럼은 feature와 label(정답)로 구성됩니다. 컬럼명을 알려주시면 더 구체적인 설명을 드립니다.';
      }

      // 파일 구조/컬럼
      if (m.includes('컬럼') || m.includes('column') || m.includes('파일 구조') || m.includes('file')) {
        return '일반적으로 id, feature_1, feature_2, ... , label(또는 target) 컬럼이 있습니다. 텍스트 데이터면 text 컬럼, 이미지면 image_path 컬럼이 포함될 수 있습니다.';
      }

      // 제출 안내
      if (m.includes('제출') || m.includes('submit') || m.includes('submission')) {
        return '제출은 보통 CSV 파일로, 예: id,prediction\n1,0.23\n2,0.78 형식을 따릅니다. 제출 양식이 제공되면 그 예시 파일을 따라주세요.';
      }

      // 평가 지표
      if (m.includes('평가') || m.includes('accuracy') || m.includes('auc') || m.includes('f1') || m.includes('f1-score')) {
        return '분류 문제: Accuracy, F1-score, AUC 등을 사용합니다. 회귀 문제: RMSE, MAE 등을 사용합니다. 다중 클래스의 경우 macro/micro F1을 확인하세요.';
      }

      // 전처리
      if (m.includes('전처리') || m.includes('feature') || m.includes('정규화') || m.includes('결측')) {
        return '전처리 팁: 결측치는 평균/중앙값으로 대체하거나 별도 카테고리로 처리하세요. 범주형은 LabelEncoder/OneHot, 수치형은 StandardScaler/MinMax를 고려하세요. 텍스트는 토큰화/정제/불용어 제거를 권장합니다.';
      }

      // 모델/베이스라인
      if (m.includes('모델') || m.includes('baseline') || m.includes('랜덤 포레스트') || m.includes('xgboost') || m.includes('lightgbm')) {
        return '초기 베이스라인: 전처리 후 간단한 RandomForest 또는 LightGBM으로 시도해 보세요. 텍스트는 TF-IDF + 로지스틱 회귀나 LightGBM이 빠르고 효과적입니다.';
      }

      // 하이퍼파라미터
      if (m.includes('하이퍼') || m.includes('learning rate') || m.includes('lr') || m.includes('epochs')) {
        return '하이퍼파라미터 팁: 작은 모델부터 시작해 learning rate=1e-3~1e-2, batch size=16/32, epochs=5~20로 실험하세요. Early stopping을 사용해 과적합을 방지하세요.';
      }

      // 예시 코드 요청
      if (m.includes('예시 코드') || m.includes('code example') || m.includes('sample code')) {
        return '예시 (Python, pandas):\nimport pandas as pd\ndf = pd.read_csv("train.csv")\nprint(df.head())\n# 전처리, 모델 학습, 예측 후 제출 파일 생성: df_submit.to_csv("submission.csv", index=False)';
      }

      // 기타: 기본 응답
      return "로컬 모드: 자세한 답변은 제한적입니다. 더 구체적으로 질문하거나 '도움'이라고 입력해 예시 질문을 확인하세요. 필요하면 제가 FAQ를 더 확장해 드리겠습니다.";
    }

    async function sendMessage() {
      const text = messageEl.value.trim();
      if (!text) return;
      appendMsg(text, 'user');
      messageEl.value = '';
      sendBtn.disabled = true;
      const placeholder = document.createElement('div');
      placeholder.className = 'msg bot';
      placeholder.textContent = '응답을 기다리는 중...';
      chatEl.appendChild(placeholder);
      chatEl.scrollTop = chatEl.scrollHeight;

      try {
        // 서버 호출 대신 로컬 응답 사용
        const reply = localResponder(text);
        placeholder.textContent = reply;
      } catch (err) {
        placeholder.textContent = '에러: ' + (err.message || err);
      } finally {
        sendBtn.disabled = false;
        chatEl.scrollTop = chatEl.scrollHeight;
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
  </script>
</body>
</html>
